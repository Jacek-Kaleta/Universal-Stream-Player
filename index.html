<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Stream Player - Demo Interaktywne</title>

    <!-- Biblioteka hls.js do strumieni m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

   <link rel="stylesheet" href="demo.css">

<link rel="stylesheet" href="src/media-player.css">
</head>
<body>

<div class="demo-header">
    <h1>Uniwersalny Odtwarzacz Strumieni</h1>
    <p>Testy możliwości odtwarzacza na licencjonowanym materiale Big Buck Bunny (CC BY 3.0)</p>
</div>

<!-- KONTENER ODTWARZACZA (KOMPONENT) -->
<div id="player-container"></div>

<!-- PANEL KONFIGURACJI ODTWARZACZA -->
<div class="demo-config-panel">
    <div class="config-title">
        <span>Konfiguracja Odtwarzania</span>
    </div>
    
    <div class="config-grid">
        <div class="config-group">
            <label for="config-format">Format strumienia / źródła:</label>
            <select id="config-format" class="config-select" onchange="applyConfiguration()">
                <option value="mp4">MP4 Direct Video</option>
                <option value="hls">HLS Stream (.m3u8)</option>
                <option value="youtube">YouTube Video</option>
            </select>
        </div>

        <div class="config-group">
            <label for="config-start-time">Czas startowy (sekundy):</label>
            <select id="config-start-time" class="config-select" onchange="applyConfiguration()">
                <option value="0">0s (od początku)</option>
                <option value="10">10s</option>
                <option value="30">30s</option>
                <option value="60">60s</option>
            </select>
        </div>

        <div class="config-group">
            <label for="config-border-radius">Zaokrąglenie rogów (borderRadius):</label>
            <select id="config-border-radius" class="config-select" onchange="applyConfiguration()">
                <option value="0px">0px (Brak)</option>
                <option value="12px">12px (Lekkie)</option>
                <option value="24px">24px (Duże)</option>
            </select>
        </div>

        <div class="config-group" style="justify-content: flex-end;">
            <label class="checkbox-label">
                <input type="checkbox" id="toggle-native-controls" checked onchange="onNativeControlsToggle(this.checked)">
                Pokaż kontrolki na ekranie
            </label>
        </div>

        <div class="config-group" style="justify-content: flex-end;">
            <label class="checkbox-label">
                <input type="checkbox" id="config-audio-only" onchange="applyConfiguration()">
                Tryb tylko audio (isAudioOnly)
            </label>
        </div>

        <div class="config-group" style="justify-content: flex-end;">
            <label class="checkbox-label">
                <input type="checkbox" id="config-thumb-full" onchange="applyConfiguration()">
                Okładka pełnoekranowa (thumbnailFull)
            </label>
        </div>
    </div>

    <button class="demo-btn-apply" onclick="applyConfiguration()">Załaduj ponownie / Zastosuj</button>
</div>

<!-- ZEWNĘTRZNY PANEL STEROWANIA DEMO -->
<div class="external-controls-wrapper">
    <div class="external-controls">
        <button class="demo-btn demo-btn-action" onclick="externalPlay()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg> Start
        </button>
        <button class="demo-btn demo-btn-stop" onclick="externalPause()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Pauza
        </button>
        <button class="demo-btn demo-btn-action" onclick="externalToggleFullscreen()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 4H4v5"/><path d="M4 4l5.5 5.5"/><path d="M15 4h5v5"/><path d="M20 4l-5.5 5.5"/><path d="M15 20h5v-5"/><path d="M20 20l-5.5-5.5"/><path d="M9 20H4v-5"/><path d="M4 20l5.5-5.5"/>
            </svg> Pełny ekran
        </button>
    </div>

    <div class="volume-control-wrapper">
        <span id="volume-icon" class="volume-icon" onclick="toggleMute()" title="Wycisz/Odcisz">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#0084ff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1" oninput="onVolumeChange(this.value)">
        <span id="volume-text" class="volume-text">100%</span>
    </div>

    <div id="time-display" class="time-display-badge">0:00 / --:--</div>
</div>

<script src="src/media-player.js"></script>

<script src="demo.js"></script>
</body>
</html>
